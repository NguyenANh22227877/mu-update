; grass.ini - co cay trang tri (SauGrass.cpp). Sua bang F4 WorldEdit -> tab Grass (nut Save ghi lai file nay, giu .bak).
; [General] Level = muc mac dinh 0 tat / 1 thap / 2 vua / 3 cao (nguoi choi doi bang /grass 0..3, luu registry GrassLevel).
; [Species] ten = cao, lac[, edge]
;   cao  : chieu cao the gioi (1 o = 100)
;   lac  : bien do dung dua theo gio 0..1 (0 = dung yen: xuong rong, da, nam)
;   edge : chi moc o o KHONG di duoc (TW_NOMOVE) giap o di duoc - cay cao khong che duong
; [WorldN] N = so thu muc Data\WorldN (Lorencia = World1)
;   Enable=0/1  StockGrass=0/1 (0 = tat co goc MU tren ban do nay)  SafeZone=0/1 (moc trong vung an toan)
;   Density = so cay trung binh / o o muc Vua   Scale = min,max   Tiles = chi so TerrainMappingLayer1 duoc moc
;   Mix = ten:trong_so, ...  (loai edge chi moc o o vien, loai thuong chi moc o o di duoc)
; Mat na ve tay: WorldN.gmask (65536 byte, 0 theo luat / 1 ep moc / 2 cam moc) - F4 to co.

