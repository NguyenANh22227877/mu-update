; env.ini - troi / gio trong ngay / thoi tiet / bong theo huong sang (ghep tu Pegasus 2.0, ten khoa giu nhu NCEm).
; Client doc lai file nay khi no doi (kiem 1 lan/s), khong can khoi dong lai.
; Lenh chat de thu nhanh (khong luu vao file): /envlog  /env 0|1|ini  /envf <lop> 0|1|ini  /envreload
;   /tod <gio>|fixed|clock|cycle [phut]|on|off|ini   /weather clear|rain|storm|snow|blizzard|fog [0-1]|auto|on|off|ini
;   /sky 0|1|2|ini   /sun auto|<cao 0-90> [huong 0-359]|disc 0|1|ini|ini   (/sun khong tham so = in trang thai)
; Tat het: [Env] Enabled=0 (hoac xoa file) -> client ve y nhu cu.

[Env]
Enabled=1

[TimeOfDay]
; Rieng lop nay khong doi hinh: no chi tinh gio/moc cho cac lop khac (WorldLighting, Sky, DynamicShadows, Post).
Enabled=1
; fixed = dung Time=, cycle = vong CycleMinutes phut bat dau tu Time=, clock = gio may nguoi choi
Source=clock
Time=18
CycleMinutes=30
Strength=1
; doc preset 4 moc tu tod\default.ini roi tod\maps\mapN.ini (khoa thieu -> bang san trong client)
UseNCEmPresets=1
NightBrightness=0.52
DawnBrightness=0.88
NoonBrightness=1
DuskBrightness=0.86
NightLighting=0.55
NightBloomBoost=1.35

[WorldLighting]
; Huong/mau sang model + dia hinh theo gio. Moi map co the ghi de o [WorldLighting_N] (N = so map).
Enabled=0
FogEnabled=1
LegacyModelLighting=1
LegacyTerrainLighting=1
LegacyStrength=0.75
LegacyAmbient=0.58
LegacyDirectional=0.85
LightingStrength=0.45
Ambient=0.90
Directional=0.30
NormalStrength=18
;TintColor=1,1,1
;LightColor=1,1,1
;LightDirection=-0.45,0.30,0.84
;FogColor=0.12,0.10,0.08
;FogStart=0.55
;FogEnd=0.98
;FogOpacity=0.25

;[WorldLighting_2]
;LightColor=0.88,1,1.18

[Weather]
Enabled=0
; Type: Clear Rain Storm Snow Blizzard Fog
Type=Rain
Intensity=0.75
AutoWeather=0
AutoMinutes=3
; 1 = theo goi thoi tiet GS gui (GS doi ngau nhien 10-20 s/lan nen de 0)
FollowServer=0
Lightning=1
MapAware=1
SnowNativeMapsNoRain=1
Wind=0.30
TransitionSeconds=3
Density=1
SnowDensityMultiplier=2.2
; 1 = bong tuyet tron / vet mua mem (Data\Custom\Weather\snow.OZT, rain.OZT); thieu file -> quad mau dinh
ParticleTexture=1

[WeatherSurface]
Enabled=0
SnowCover=1
Footprints=1
Shelter=1
Wetness=1
SnowAccumulationSeconds=7
SnowMeltSeconds=180
DeviasBaseSnow=0.34
SnowCoverRadiusTiles=20
FootprintLifetime=34
FootprintSpacing=42
FootprintOpacity=0.5
FootprintWidthScale=1
FootprintLengthScale=1

[Sky]
Enabled=0
; 1 = hop troi texture Data\Custom\Sky\WorldN, 0 = chi gradient mau
SkyBoxEnabled=1
; Map giu nen goc (khong ve hop troi, suong giu mau cua map). Map kin (dungeon, su kien...) luon giu san.
; 41 Balgass Barrack, 42 Balgass Refuge. Bo trong = khong them map nao.
OldSkyMaps=41,42
Stars=1
; so sao ve = StarCount x StarDensity (toi da 1000); StarSize = canh sao / nua canh hop troi
StarCount=600
StarSize=0.004
; dai do cao rai sao (do tren chan troi). Camera MU chi ngua toi ~15-20 do nen don sao xuong thap,
; min cao hon dinh nui ve san tren anh hop troi
StarMinElevation=9
StarMaxElevation=40
; Suong phu hop troi khi mua/bao/suong: alpha o dinh / chan troi (x muc suong)
Haze=1
HazeTop=0.45
HazeHorizon=1
Intensity=1
StarIntensity=0.92
StarDensity=0.62
HorizonHeight=0.40
HorizonSoftness=0.22
HorizonFogBlend=0.55
WeatherResponse=1
SkyBoxHalfSize=3000
SkyBoxTopHeight=1500
SkyBoxBottomHeight=-350
SkyBoxTextureStrength=1
SkyBoxTintStrength=0.58
; Muc keo sac anh troi luc trua (lerp theo moc Noon); -1 = dung SkyBoxTintStrength
SkyBoxTintStrengthDay=0.30
NightTopColor=0.018,0.030,0.100
NightHorizonColor=0.050,0.095,0.205
NightStars=1
DawnTopColor=0.235,0.375,0.660
DawnHorizonColor=0.930,0.500,0.285
DawnStars=0.08
NoonTopColor=0.195,0.475,0.850
NoonHorizonColor=0.720,0.850,0.970
NoonStars=0
DuskTopColor=0.110,0.160,0.390
DuskHorizonColor=0.930,0.350,0.190
DuskStars=0.12

[Sun]
; Huong nang (sang model + dia hinh + bong). Mode: 0 = auto (theo gio nhu cu), 1 = manual (Elevation/Azimuth duoi day)
Mode=0
; Do cao mat troi 0-90 (duoi 3 kep 3 de bong khong dai vo han), dung khi Mode=1
Elevation=57
; Huong 0-359 do: 0 = +X ban do, tang nguoc chieu kim dong ho ve +Y
Azimuth=0
; 1 = ve dia mat troi + quang (ban dem la trang). Can [Sky] Enabled=1, map giu nen goc thi khong ve.
Disc=1
; Nua canh loi dia / khoang cach toi thanh hop troi (0.035 ~ 2 do), quang to gap 3.5
DiscSize=0.035
; Dia ve o do cao nen vao dai nay (o pitch -88 mep tren man hinh ~15.7 do); nang va bong van dung goc that
DiscMinElevation=8
DiscMaxElevation=15
; 1 = ban dem ve trang xanh nhat thay mat troi
Moon=1

[SnowMaterial]
Enabled=0
SnowNativeMapsOnly=1
ExposedOnly=1
OpaqueOnly=1
MaxOpacity=0.72
SlopeStart=0.18
SlopeFull=0.72
Color=0.90,0.95,1.00
; Tuyet bam vat the tinh (xap xi): tong sang-lanh deu khi dat phu tuyet > 30%, 0 = tat
TintStrength=0.6

[DynamicShadows]
; Bong nguoi/quai nghieng theo huong mat troi (can [TimeOfDay] de huong doi theo gio).
Enabled=0
Opacity=0.42
LengthScale=1.10
; Bong dai toi da = MaxSlope lan chieu cao (nen mem, mat troi thap tien dan toi day), 0.5..6. Slider "Do dai bong"
; tab Light (/sun len) ghi de. Bong phang (GL) qua 3 de nhoe thanh vet gai; shadow map Vulkan dai van ra dang nguoi.
MaxSlope=2.5
GroundOffset=4
; 1 = bong phang ve mot lop do dam deu, nhieu bong chong nhau khong dam them (lop /envf shadowmerge)
SingleLayer=0

[StaticObjectShadows]
; Bong cay/nha theo huong mat troi. Can o "Shadow" trong Game Option VA [DynamicShadows] Enabled=1 (dung chung
; huong + do dam bong). Do chi phi truoc khi bat (/envlog). Moi khung chi ve MaxCasters vat gan nhan vat nhat.
Enabled=0
MaxDistance=1800
NearDistance=1400
MaxCasters=60
Trees=1
SmallObjects=0

[Post]
; Suong mu + do sang man hinh theo gio/thoi tiet (ban Vulkan).
Enabled=0
Fog=1
Exposure=1
